<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linguist AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --text-color: var(--tg-theme-text-color, #202124);
            --hint-color: var(--tg-theme-hint-color, #80868b);
            --button-color: var(--tg-theme-button-color, #5c6bc0);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(92, 107, 192, 0.1), transparent 400px),
                              radial-gradient(circle at bottom left, rgba(156, 39, 176, 0.05), transparent 400px);
            color: var(--text-color);
            margin: 0;
            padding: 24px 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--button-color), #9c27b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: var(--hint-color);
        }

        .card {
            background-color: var(--secondary-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: var(--hint-color);
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-color);
            font-family: inherit;
            font-size: 15px;
            padding: 14px 16px;
            border-radius: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
        }

        select:focus, textarea:focus {
            border-color: var(--button-color);
            box-shadow: 0 0 0 3px rgba(92, 107, 192, 0.15);
        }

        textarea {
            min-height: 120px;
            resize: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--hint-color);
            opacity: 0.6;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--button-color), #7986cb);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(92, 107, 192, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(92, 107, 192, 0.2);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Dark mode specific tweaks if the user's Telegram is dark */
        @media (prefers-color-scheme: dark) {
            :root {
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            select, textarea {
                border: 1px solid rgba(255,255,255,0.05);
            }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <h1>Linguist AI ✦</h1>
        <p>Aqlli va chuqur tarjima tizimi</p>
    </div>

    <div class="card">
        <div class="input-group">
            <label>Qaysi tildan:</label>
            <div class="select-wrapper">
                <select id="sourceLang">
                    <option value="Auto">✨ Avtomatik aniqlash</option>
                    <option value="Uzbek">🇺🇿 O'zbek tili</option>
                    <option value="English">🇬🇧 Ingliz tili</option>
                    <option value="Russian">🇷🇺 Rus tili</option>
                    <option value="Arabic">🇸🇦 Arab tili</option>
                    <option value="Chinese">🇨🇳 Xitoy tili</option>
                    <option value="Korean">🇰🇷 Koreys tili</option>
                    <option value="Spanish">🇪🇸 Ispan tili</option>
                    <option value="Turkish">🇹🇷 Turk tili</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Qaysi tilga:</label>
            <div class="select-wrapper">
                <select id="targetLang">
                    <option value="Uzbek">🇺🇿 O'zbek tili</option>
                    <option value="English">🇬🇧 Ingliz tili</option>
                    <option value="Russian">🇷🇺 Rus tili</option>
                    <option value="Arabic">🇸🇦 Arab tili</option>
                    <option value="Chinese">🇨🇳 Xitoy tili</option>
                    <option value="Korean">🇰🇷 Koreys tili</option>
                    <option value="Spanish">🇪🇸 Ispan tili</option>
                    <option value="Turkish">🇹🇷 Turk tili</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <label>Matn yoki so'z</label>
            <textarea id="text" placeholder="Tarjima qilish uchun shu yerga yozing..."></textarea>
        </div>
    </div>

    <button id="translateBtn" class="action-btn">
        <svg viewBox="0 0 24 24">
            <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
        </svg>
        Tarjima qilish
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Tugma rangini telegram mavzusiga qarab moslashtirish (MainButton)
        // Telegramning o'zini tayyor "MainButton"idan ham foydalansak bo'ladi, 
        // lekin biz HTML ichidagi tugmani dizayn qildik, shuning uchun shuni o'zidan ishlatamiz.

        document.getElementById('translateBtn').addEventListener('click', () => {
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            const text = document.getElementById('text').value;

            if (!text.trim()) {
                tg.showAlert("Iltimos, matn kiriting!");
                return;
            }

            // Tugma bosilganda animatsiya effekti uchun
            const btn = document.getElementById('translateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg> Yuborilmoqda...`;
            btn.style.opacity = '0.8';

            setTimeout(() => {
                const data = JSON.stringify({
                    action: 'translate',
                    sourceLang: sourceLang,
                    targetLang: targetLang,
                    text: text
                });
                tg.sendData(data);
            }, 300);
        });
    </script>
</body>
</html>
